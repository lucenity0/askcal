[project]
name = "askcal-api"
version = "0.1.0"
description = "Askcal backend — context-aware daily scheduler for student freelancers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "google-auth[requests]>=2.30",
    "google-genai>=1.0",
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
